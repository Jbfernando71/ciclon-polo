name: Actualizar Ciclón Polo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Verificar archivos
        run: |
          echo "Archivos disponibles:"
          ls -la
          test -f actualizar_polo_v6.2.py || (echo "ERROR: No existe actualizar_polo_v6.2.py" && exit 1)
          test -f datos_polo.json || (echo "ERROR: No existe datos_polo.json" && exit 1)
          python -m py_compile actualizar_polo_v6.2.py

      - name: Actualizar datos de Polo
        run: python actualizar_polo_v6.2.py

      - name: Mostrar resultado
        run: |
          echo "===== DATOS GENERADOS ====="
          cat datos_polo.json
          echo "============================"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_polo.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualización automática Polo - SMN/CONAGUA"
            git push
          fi
