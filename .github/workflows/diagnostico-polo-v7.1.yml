name: Diagnóstico selector Polo SMN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ejecutar diagnóstico
        run: python diagnostico_polo_v7.1.py
      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-polo-smn
          path: diagnostico_polo/
          if-no-files-found: warn
